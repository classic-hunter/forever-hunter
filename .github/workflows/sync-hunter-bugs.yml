name: Sync Hunter Bugs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-hunter-bugs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync Hunter bug data
        run: node scripts/sync-hunter-bugs.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated tracker
        shell: bash
        run: |
          if git diff --quiet -- data/hunter-bugs.json HUNTER_BUGS.md; then
            echo "No Hunter bug changes to commit."
            exit 0
          fi
          git config user.name "forever-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hunter-bugs.json HUNTER_BUGS.md
          git commit -m "chore: sync Hunter bugs"
          git push
